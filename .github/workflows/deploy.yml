name: Deploy to EC2

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build
              env:
                  SKIP_ENV_VALIDATION: true

            - name: Create deployment package
              run: |
                  mkdir -p deploy
                  cp -r .next deploy/
                  cp -r public deploy/
                  cp package.json deploy/
                  cp package-lock.json deploy/
                  cp next.config.js deploy/
                  tar -czf deploy.tar.gz -C deploy .

            - name: Deploy to EC2
              env:
                  PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
                  HOST: ${{ secrets.EC2_HOST }}
                  USER: ${{ secrets.EC2_USER }}
              run: |
                  echo "$PRIVATE_KEY" > private_key.pem
                  chmod 600 private_key.pem

                  # EC2にデプロイパッケージを転送
                  scp -o StrictHostKeyChecking=no -i private_key.pem deploy.tar.gz ${USER}@${HOST}:/home/${USER}/

                  # EC2でデプロイを実行
                  ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << 'ENDSSH'
                    cd /home/ubuntu/swing-trader-practice
                    
                    # バックアップを作成
                    if [ -d ".next" ]; then
                      rm -rf .next.backup
                      mv .next .next.backup
                    fi
                    
                    # 新しいビルドを展開
                    tar -xzf /home/ubuntu/deploy.tar.gz
                    rm /home/ubuntu/deploy.tar.gz
                    
                    # 依存関係のインストール（本番用のみ）
                    npm ci --omit=dev
                    
                    # PM2でアプリケーションを再起動
                    pm2 restart swing-trader || pm2 start npm --name swing-trader -- start
                    
                    echo "Deployment completed successfully"
                  ENDSSH

                  rm -f private_key.pem
